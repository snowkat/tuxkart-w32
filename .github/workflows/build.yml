name: Build TuxKart

on:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  build:
    name: Build Win32
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host
      - name: Run build script
        id: build
        run: ./build.sh
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxkart-w32
          path: |
            out
